name: canon-lint

on:
  push:
    paths:
      - "fleet-canon/**"
      - ".github/workflows/canon-lint.yml"
  workflow_dispatch:
  schedule:
    # Sunday 22:23 UTC — off-peak; the staleness clock needs a weekly tick
    - cron: "23 22 * * 0"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: canon-lint over Tier-1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 fleet-canon/lint.py
      # Flip to --enforce-coverage once every Tier-1 repo has a CANON.md.
      # The ratchet: warnings today, failures tomorrow.
