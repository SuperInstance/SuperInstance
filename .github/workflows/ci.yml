name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install @superinstance/tminus-client @superinstance/tminus-dispatcher

      - name: Smoke test packages
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            // tminus-client: safe to import (pure CJS module).
            const client = require('@superinstance/tminus-client');
            if (!client || Object.keys(client).length === 0) throw new Error('tminus-client exports nothing');
            console.log('✅ tminus-client exports:', Object.keys(client).join(', '));
            // tminus-dispatcher: importing it BOOTS A WS SERVER (top-level side effect),
            // and it is not CJS-requireable (exports nothing via require). Smoke = install integrity.
            for (const name of ['@superinstance/tminus-client', '@superinstance/tminus-dispatcher']) {
              const pj = path.join('node_modules', name, 'package.json');
              const pkg = JSON.parse(fs.readFileSync(pj, 'utf8'));
              if (!pkg.name || !pkg.version) throw new Error(name + ': package.json missing name/version');
              console.log('✅ ' + name + '@' + pkg.version + ' installed (entry: ' + (pkg.main || 'exports-map') + ')');
            }
          "
            const client = require('@superinstance/tminus-client');
            const dispatcher = require('@superinstance/tminus-dispatcher');
            if (!client || Object.keys(client).length === 0) throw new Error('tminus-client exports nothing');
            if (!dispatcher || Object.keys(dispatcher).length === 0) throw new Error('tminus-dispatcher exports nothing');
            console.log('✅ Smoke test passed — both packages export valid modules');
          "

      - name: Run repo tests
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          pkg_test=$(node -e "const p=require('./package.json'); process.stdout.write(p.scripts && p.scripts.test ? 'yes' : 'no')")
          if [ "$pkg_test" = "yes" ]; then
            npm install
            npm test
          else
            echo "No test script found in package.json — skipping"
          fi
